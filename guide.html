      <section id="step-3">

        <p data-i18n="stepThreeBody">[待補內容] 說明多人協作、檢查流程與現場確認方式。</p>
        <ul>

        </ul>

  <script>
    const LANGUAGE_CACHE_KEY = 'gearflow-language';
    const messages = {
      zh: {
        pageTitle: 'GearFlow | 使用說明', home: '回首頁', eyebrow: '使用說明', title: 'GearFlow 操作模板', intro: '以下內容先保留為模板，之後可直接補上正式說明。', stepOneTitle: '01. 建立活動', stepOneBody: '[待補內容] 說明如何新增活動、命名規則、日期與基本資料設定。', stepTwoTitle: '02. 整理裝備與地點', stepTwoBody: '[待補內容] 說明如何把裝備、倉庫、車輛與目的地對應起來。', stepThreeTitle: '03. 團隊同步查看', stepThreeBody: '[待補內容] 說明多人協作、檢查流程與現場確認方式。', placeholderOne: '[待補內容] 範例 1', placeholderTwo: '[待補內容] 範例 2'
      },
      en: {
        pageTitle: 'GearFlow | Guide', home: 'Back to home', eyebrow: 'Guide', title: 'GearFlow guide template', intro: 'This page is a template for now. Formal instructions can be added here later.', stepOneTitle: '01. Create an event', stepOneBody: '[Placeholder] Explain how to add an event, naming rules, dates, and basic settings.', stepTwoTitle: '02. Organize gear and locations', stepTwoBody: '[Placeholder] Explain how to connect gear, warehouses, vehicles, and destinations.', stepThreeTitle: '03. Share with the team', stepThreeBody: '[Placeholder] Explain team collaboration, checks, and on-site confirmation.', placeholderOne: '[Placeholder] Example 1', placeholderTwo: '[Placeholder] Example 2'
      },
      ja: {
        pageTitle: 'GearFlow | 使い方', home: 'ホームへ戻る', eyebrow: '使い方', title: 'GearFlow 操作テンプレート', intro: 'このページは一旦テンプレートです。正式な説明は後で追加できます。', stepOneTitle: '01. イベントを作成', stepOneBody: '[未入力] イベント追加、命名ルール、日付、基本設定を説明します。', stepTwoTitle: '02. 物品と場所を整理', stepTwoBody: '[未入力] 物品、倉庫、車両、目的地の紐付けを説明します。', stepThreeTitle: '03. チームで共有', stepThreeBody: '[未入力] 複数人での確認、チェック手順、現場確認を説明します。', placeholderOne: '[未入力] 例 1', placeholderTwo: '[未入力] 例 2'
      }
    };

    const languageSelect = document.getElementById('language-select');

    function homeUrlForLanguage(language) {
      if (language === 'en') return 'en/index.html';
      if (language === 'ja') return 'ja/index.html';
      return 'index.html';
    }

    function loadLanguage() {
      const params = new URLSearchParams(window.location.search);
      const urlLanguage = params.get('lang');
      if (urlLanguage && messages[urlLanguage]) return urlLanguage;
      try {
        const saved = localStorage.getItem(LANGUAGE_CACHE_KEY);
        if (saved && messages[saved]) return saved;
      } catch {
        // ignore
      }
      const browserLanguage = (navigator.language || '').toLowerCase();
      if (browserLanguage.startsWith('ja')) return 'ja';
      if (browserLanguage.startsWith('zh')) return 'zh';
      return 'en';
    }

    function persistLanguage(language) {
      try {
        localStorage.setItem(LANGUAGE_CACHE_KEY, language);
      } catch {
        // ignore
      }
    }

    function applyLanguage(language) {
      const copy = messages[language] || messages.zh;
      document.documentElement.lang = language === 'zh' ? 'zh-Hant' : language;
      document.title = copy.pageTitle;
      languageSelect.value = language;
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = copy[node.dataset.i18n] || node.textContent;
      });
      document.getElementById('home-link').href = homeUrlForLanguage(language);
      document.getElementById('home-brand-link').href = homeUrlForLanguage(language);
      persistLanguage(language);
    }

    languageSelect.addEventListener('change', () => {
      applyLanguage(languageSelect.value);
    });

    applyLanguage(loadLanguage());
  </script>
</body>
</html>
